
services:
  db:
    image: postgres:14-alpine
    container_name: laptop-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: laptop_marketplace
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - marketplace

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - JWT_SECRET=supersecretkey
      - CATALOG_SERVICE_URL=http://catalog-service:5002
      - RECOMMENDATION_SERVICE_URL=http://recommendation-service:5004
      - INVENTORY_SERVICE_URL=http://inventory-service:5003
      - AUTH_SERVICE_URL=http://auth-service:5001
    depends_on:
      - db
    volumes:
      - ./services/api-gateway:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/laptop_marketplace
      - JWT_SECRET=supersecretkey
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/auth-service:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

  catalog-service:
    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    container_name: catalog-service
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/laptop_marketplace
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/catalog-service:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: inventory-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/laptop_marketplace
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/inventory-service:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

  recommendation-service:
    build:
      context: .
      dockerfile: services/recommendation-service/Dockerfile
    container_name: recommendation-service
    ports:
      - "5004:5004"
    environment:
      - CATALOG_SERVICE_URL=http://catalog-service:5002
    depends_on:
      - catalog-service
    volumes:
      - ./services/recommendation-service:/app
    command: uvicorn main:app --host 0.0.0.0 --port 5004
    networks:
      - marketplace

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: notification-service
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
    depends_on:
      - db
    volumes:
      - ./services/notification-service:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

  location-service:
    build:
      context: .
      dockerfile: services/location-service/Dockerfile
    container_name: location-service
    ports:
      - "5006:5006"
    environment:
      - PORT=5006
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/laptop_marketplace
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./services/location-service:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

  home:
    build:
      context: .
      dockerfile: apps/home/Dockerfile
    container_name: home-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000
    depends_on:
      - api-gateway
    volumes:
      - ./apps/home:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

  customer:
    build:
      context: .
      dockerfile: apps/customer/Dockerfile
    container_name: customer-frontend
    ports:
      - "3001:3001"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api-gateway
    volumes:
      - ./apps/customer:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

  vendor:
    build:
      context: .
      dockerfile: apps/vendor/Dockerfile
    container_name: vendor-frontend
    ports:
      - "3002:3002"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api-gateway
    volumes:
      - ./apps/vendor:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: admin-frontend
    ports:
      - "3003:3003"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api-gateway
    volumes:
      - ./apps/admin:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    container_name: auth-frontend
    ports:
      - "3004:3004"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - api-gateway
    volumes:
      - ./apps/auth:/app
      - /app/node_modules
    command: npm run dev
    networks:
      - marketplace

volumes:
  db_data:

networks:
  marketplace:
    driver: bridge
